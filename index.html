<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3c8f76"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>まなモン</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#24463e;background:#f4faf3}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 18px 40px}.panel{background:white;border-radius:28px;padding:24px;box-shadow:0 8px 25px #1c634b16}h1{font-size:2.2rem;margin:10px 0}h2{font-size:1.65rem;line-height:1.7}.sub{color:#657b73}.monster{font-size:110px;text-align:center;margin:15px 0;filter:drop-shadow(0 8px 8px #abc9b8)}button{width:100%;min-height:66px;border-radius:20px;border:2px solid #dcebe3;background:#f7fbf8;color:#24463e;font-size:1.22rem;font-weight:750;margin:8px 0;padding:12px;cursor:pointer;touch-action:manipulation}button.primary{background:#258768;color:white;border-color:#258768}button:disabled{opacity:.6}.bar{height:13px;border-radius:20px;background:#e2eee6;overflow:hidden}.fill{height:100%;background:#4bb18b;transition:width .2s}.pill{display:inline-block;background:#e4f5e9;border-radius:20px;padding:7px 13px;font-weight:700}.answer.good{border-color:#29946b;background:#e1f7e8}.answer.bad{border-color:#c97b59;background:#fff0e7}.feedback{padding:16px;background:#eef8ef;border-radius:17px;line-height:1.8;margin-top:15px}ruby{ruby-position:over}rt{font-size:.55em;font-weight:500}#quiz,#finish{display:none}.small{font-size:.9rem}footer{text-align:center;color:#81928b;margin-top:22px;font-size:.8rem}.stats{display:flex;justify-content:space-between;gap:12px}.stats>div{flex:1;background:#eff8ef;border-radius:15px;padding:13px;text-align:center}.stats strong{display:block;font-size:1.5rem}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><section id="home" class="panel"><span class="pill">🌱 まなモン・Phase 1</span><h1>きょうの ぼうけん！</h1><p class="sub">まいにち 5もん。じぶんの ペースで すすもう。</p><div class="monster" aria-label="はっぱのモンスター">🌱</div><div class="stats"><div>きょうの ミッション<strong>5もん</strong></div><div>きのうまでの クリア<strong id="total">0かい</strong></div></div><button class="primary" id="start">ぼうけん スタート！</button><p class="sub small">むずかしくても だいじょうぶ。さいごまで できたら クリア！</p></section><section id="quiz" class="panel"><div class="stats"><span class="pill" id="subject">りか</span><span id="counter">1 / 5 もん</span></div><p></p><div class="bar"><div class="fill" id="progress" style="width:0%"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="next" class="primary" hidden>つぎへ ▶</button></section><section id="finish" class="panel"><div class="monster">🎉</div><h1>ぼうけん クリア！</h1><h2 id="result"></h2><p>さいごまで できたね！ モンスターが げんきに なったよ。</p><div class="stats"><div>けいけんち<strong>+50 XP</strong></div><div>クリアした もんだい<strong>5もん</strong></div></div><button class="primary" id="again">ホームに もどる</button></section><footer>サンプル問題です。四谷大塚の教材内容を転載したものではありません。</footer></main><script>
const data=[
{subject:'りか',q:'<ruby>植物<rt>しょくぶつ</rt></ruby>が <ruby>光<rt>ひかり</rt></ruby>を つかって <ruby>養分<rt>ようぶん</rt></ruby>を つくる はたらきは？',opts:['<ruby>呼吸<rt>こきゅう</rt></ruby>','<ruby>光合成<rt>こうごうせい</rt></ruby>','<ruby>蒸散<rt>じょうさん</rt></ruby>'],a:1,why:'<ruby>光合成<rt>こうごうせい</rt></ruby>は、<ruby>光<rt>ひかり</rt></ruby>の エネルギーを つかって <ruby>養分<rt>ようぶん</rt></ruby>を つくる はたらきだよ。'},
{subject:'りか',q:'<ruby>葉<rt>は</rt></ruby>から <ruby>水蒸気<rt>すいじょうき</rt></ruby>が でる はたらきは？',opts:['<ruby>蒸散<rt>じょうさん</rt></ruby>','<ruby>受粉<rt>じゅふん</rt></ruby>','<ruby>発芽<rt>はつが</rt></ruby>'],a:0,why:'<ruby>蒸散<rt>じょうさん</rt></ruby>は、<ruby>植物<rt>しょくぶつ</rt></ruby>から <ruby>水<rt>みず</rt></ruby>が <ruby>水蒸気<rt>すいじょうき</rt></ruby>として でることだよ。'},
{subject:'りか',q:'<ruby>花粉<rt>かふん</rt></ruby>が めしべの <ruby>先<rt>さき</rt></ruby>に つくことは？',opts:['<ruby>発芽<rt>はつが</rt></ruby>','<ruby>受粉<rt>じゅふん</rt></ruby>','<ruby>発根<rt>はっこん</rt></ruby>'],a:1,why:'<ruby>受粉<rt>じゅふん</rt></ruby>すると、<ruby>種子<rt>しゅし</rt></ruby>が できるための <ruby>変化<rt>へんか</rt></ruby>が はじまるよ。'},
{subject:'しゃかい',q:'<ruby>日本<rt>にほん</rt></ruby>で いちばん <ruby>面積<rt>めんせき</rt></ruby>が おおきい <ruby>都道府県<rt>とどうふけん</rt></ruby>は？',opts:['<ruby>北海道<rt>ほっかいどう</rt></ruby>','<ruby>岩手県<rt>いわてけん</rt></ruby>','<ruby>長野県<rt>ながのけん</rt></ruby>'],a:0,why:'<ruby>北海道<rt>ほっかいどう</rt></ruby>が いちばん <ruby>広<rt>ひろ</rt></ruby>いよ。'},
{subject:'しゃかい',q:'<ruby>日本<rt>にほん</rt></ruby>の <ruby>首都<rt>しゅと</rt></ruby>は どこ？',opts:['<ruby>大阪<rt>おおさか</rt></ruby>','<ruby>京都<rt>きょうと</rt></ruby>','<ruby>東京<rt>とうきょう</rt></ruby>'],a:2,why:'<ruby>東京<rt>とうきょう</rt></ruby>は <ruby>日本<rt>にほん</rt></ruby>の <ruby>首都<rt>しゅと</rt></ruby>だよ。'}];
let i=0,score=0,selected=false;const $=id=>document.getElementById(id);function show(id){['home','quiz','finish'].forEach(x=>$(x).style.display=x===id?'block':'none')};function render(){selected=false;const q=data[i];$('subject').textContent=q.subject;$('counter').textContent=`${i+1} / 5 もん`;$('progress').style.width=`${i/5*100}%`;$('question').innerHTML=q.q;$('feedback').hidden=true;$('next').hidden=true;$('options').innerHTML='';q.opts.forEach((opt,j)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`${['A','B','C'][j]}　${opt}`;b.onclick=()=>{if(selected)return;selected=true;const ok=j===q.a;if(ok)score++;[...$('options').children].forEach((el,k)=>{el.disabled=true;if(k===q.a)el.classList.add('good');else if(k===j)el.classList.add('bad')});$('feedback').innerHTML=`<strong>${ok?'せいかい！ ⭐':'ひとつ おぼえたね！ 🌱'}</strong><p>${q.why}</p>`;$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=i===4?'ぼうけん クリア！':'つぎの もんだいへ ▶'};$('options').append(b)})}
$('start').onclick=()=>{i=0;score=0;show('quiz');render()};$('next').onclick=()=>{i++;if(i===5){$('result').textContent=`5もんちゅう ${score}もん せいかい！`;try{const n=Number(localStorage.getItem('manamon-clears')||0)+1;localStorage.setItem('manamon-clears',String(n));$('total').textContent=n+'かい'}catch(e){}show('finish')}else render()};$('again').onclick=()=>show('home');try{$('total').textContent=(Number(localStorage.getItem('manamon-clears')||0))+'かい'}catch(e){}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
