<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dc6f9e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>まなモン Phase 3 ももいろ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#65374f;background:#fff2f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#ffe0ee,transparent 480px),#fff2f8}main{max-width:640px;margin:auto;padding:18px 14px 45px}.panel{background:white;border:1px solid #f5d8e5;border-radius:28px;padding:22px;box-shadow:0 9px 25px #a94e7518}h1{font-size:1.9rem;margin:10px 0}h2{font-size:1.35rem;line-height:1.65}p{line-height:1.65}.sub{color:#9c6b82}.small{font-size:.83rem}.pill{display:inline-block;background:#ffe2ef;border-radius:99px;padding:7px 13px;font-weight:800;font-size:.85rem}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero{background:linear-gradient(145deg,#ffe1ee,#fff0f6);border-radius:22px;margin:16px 0;padding:12px;text-align:center}.hero svg{height:195px;max-width:100%;filter:drop-shadow(0 10px 8px #b75c8533)}.stats{display:flex;gap:10px}.stats>div{flex:1;background:#fff0f6;border-radius:15px;padding:12px;text-align:center;font-size:.84rem}.stats strong{display:block;font-size:1.3rem}.bar{height:13px;border-radius:20px;background:#f5d9e5;overflow:hidden}.fill{height:100%;background:#ef91b7;transition:width .25s}button{width:100%;min-height:59px;border-radius:18px;border:2px solid #f1ccdd;background:#fff9fc;color:#65374f;font-size:1.1rem;font-weight:800;margin:7px 0;padding:11px;cursor:pointer;touch-action:manipulation}button.primary{background:#d85c93;color:white;border-color:#d85c93}button.secondary{background:#ffe5f0}button:focus-visible{outline:3px solid #efb14b;outline-offset:2px}button:disabled{opacity:.72}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.card{border:2px solid #f2d9e5;border-radius:20px;padding:10px;background:#fffafd;text-align:center}.card svg{width:100%;height:120px}.card.selected{border-color:#d85c93;background:#ffdeed}.card.locked{opacity:.6}.name{font-weight:850}.answer.good{border-color:#d85c93;background:#ffe5f0}.answer.bad{border-color:#c97b59;background:#fff0e7}.feedback{padding:14px;background:#fff0f6;border-radius:16px;line-height:1.7;margin-top:14px}ruby{ruby-position:over}rt{font-size:.55em;font-weight:500}section[hidden],div[hidden],button[hidden]{display:none!important}footer{text-align:center;color:#82968b;margin-top:20px;font-size:.75rem}.tiny{font-size:.75rem}.center{text-align:center}.collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.collection button{padding:6px;margin:0;min-height:0}.collection svg{width:100%;height:100px}.evolution{background:#fff4d9;border-radius:16px;padding:12px;margin-top:12px}.tag{color:#bb4d7c;font-weight:850}.back{width:auto;min-height:38px;padding:6px 13px;font-size:.9rem}.shine{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:370px){.panel{padding:15px}.hero svg{height:150px}h1{font-size:1.6rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>

<section id="home" class="panel" hidden><div class="top"><span class="pill">🌸 まなモン Phase 3</span><button class="back" id="toBook">📖 ずかん</button></div><h1>きょうの ぼうけん！</h1><p class="sub">まいにち 5もん。ふくしゅうも じどうで でてくるよ。</p><div class="hero"><div id="homeMonster"></div><div class="name" id="homeName"></div><div id="homeLevel" class="tag"></div><div class="bar" style="margin:10px auto;max-width:280px"><div id="xpBar" class="fill"></div></div><div class="small sub" id="xpText"></div></div><div class="stats"><div>きょうの ミッション<strong id="missionCount">5もん</strong></div><div>これまでの クリア<strong id="total">0かい</strong></div></div><p class="sub small" id="dueInfo"></p><button class="primary" id="start">ぼうけん スタート！</button><p class="sub small">まちがえても だいじょうぶ。さいごまで できたら クリア！</p></section>
<section id="quiz" class="panel" hidden><div class="top"><span class="pill" id="subject">りか</span><strong id="counter">1 / 5 もん</strong></div><div class="bar" style="margin:17px 0"><div class="fill" id="progress"></div></div><div class="pill" id="modeLabel">3たく</div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="reveal" class="secondary" hidden>こたえを みる</button><div id="selfGrade" hidden><button class="secondary" id="gradeNo">まだ むずかしい</button><button class="primary" id="gradeYes">じぶんで できた！</button></div><button id="next" class="primary" hidden>つぎへ ▶</button></section>
<section id="finish" class="panel" hidden><div class="center"><div style="font-size:60px">🎉</div><h1>ぼうけん クリア！</h1><h2 id="result"></h2><p>さいごまで できたね！</p></div><div class="hero"><div id="finishMonster"></div><div class="name" id="finishName"></div><strong id="earned"></strong><div id="levelMessage" class="tag"></div></div><div class="evolution" id="newFriend" hidden></div><button class="primary" id="again">ホームに もどる</button></section>
<section id="book" class="panel" hidden><div class="top"><h1>📖 なかま ずかん</h1><button class="back" id="bookBack">もどる</button></div><p class="sub">ももるんと いっしょに ぼうけんすると あたらしい なかまが みつかるよ。</p><div id="collection" class="collection"></div><div id="bookDetail" class="hero"></div></section>
<footer>オリジナルモンスターとサンプル問題を使用。教材の転載ではありません。<br>学習・育成データはこの端末のブラウザ内に保存されます。</footer></main><script src="questions.js"></script><script>
'use strict';
const KEY='manamon-phase2-save-v1';
const species=[{id:'leaf',name:'ももるん',color:'#ffb2d0',dark:'#d76b9e',accent:'#ffe4f0',kind:'leaf'},{id:'water',name:'ふわりん',color:'#e8b8ef',dark:'#ad76bd',accent:'#fff0fb',kind:'water'},{id:'sun',name:'いちごまる',color:'#ff9eb1',dark:'#d96b86',accent:'#ffe0e8',kind:'sun'}];
const $=id=>document.getElementById(id);
const blank=()=>({starter:null,active:null,unlocked:[],xp:{leaf:0,water:0,sun:0},clears:0});
let save=blank(),pick=null,idx=0,score=0,earned=0,answered=false,session=[],todayRewarded={};
try{let old=JSON.parse(localStorage.getItem(KEY));if(old&&typeof old==='object'){save={...blank(),...old,xp:{...blank().xp,...(old.xp||{})}}}else{save.clears=Number(localStorage.getItem('manamon-clears')||0)||0}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));localStorage.setItem('manamon-clears',String(save.clears))}catch(e){}}
function level(xp){return Math.floor(Math.max(0,xp)/50)+1}function svg(mon,lvl=1){let c=mon.color,d=mon.dark,a=mon.accent,advanced=lvl>=4;let crown=mon.kind==='leaf'?`<path d="M82 70 Q57 36 77 21 Q105 32 99 70Z" fill="${d}"/><path d="M112 70 Q133 28 158 32 Q153 61 112 70Z" fill="${c}"/>`:mon.kind==='water'?`<path d="M100 16 Q130 55 100 75 Q69 55 100 16Z" fill="${a}" stroke="${d}" stroke-width="4"/>`:`<g fill="${a}"><path d="M99 17L111 60H87Z"/><path d="M40 54L74 79L54 97Z"/><path d="M160 54L146 97L126 79Z"/></g>`;return `<svg viewBox="0 0 200 200" role="img" aria-label="${mon.name} レベル${lvl}" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="184" rx="55" ry="9" fill="#b67b9640"/>${crown}<path d="M100 59 C47 59 32 103 46 143 Q57 174 100 174 Q143 174 154 143 C168 103 153 59 100 59Z" fill="${c}" stroke="${d}" stroke-width="4"/><ellipse cx="78" cy="117" rx="8" ry="11" fill="#65374f"/><ellipse cx="122" cy="117" rx="8" ry="11" fill="#65374f"/><circle cx="81" cy="113" r="3" fill="white"/><circle cx="125" cy="113" r="3" fill="white"/><ellipse cx="62" cy="135" rx="11" ry="7" fill="#ff9c9c" opacity=".65"/><ellipse cx="138" cy="135" rx="11" ry="7" fill="#ff9c9c" opacity=".65"/><path d="M91 136 Q100 145 109 136" fill="none" stroke="#65374f" stroke-width="4" stroke-linecap="round"/>${advanced?`<path d="M55 83 Q27 53 23 103 Q40 114 55 105 M145 83 Q173 53 177 103 Q160 114 145 105" fill="${a}" stroke="${d}" stroke-width="3"/><circle cx="100" cy="81" r="9" fill="${a}" stroke="${d}" stroke-width="2"/>`:''}<ellipse cx="72" cy="167" rx="13" ry="7" fill="${d}"/><ellipse cx="128" cy="167" rx="13" ry="7" fill="${d}"/></svg>`}
function screen(id){['home','quiz','finish','book'].forEach(x=>$(x).hidden=x!==id);window.scrollTo({top:0,behavior:'instant'})}
function getMon(id){return species.find(x=>x.id===id)||species[0]}
// Phase 3: each item keeps its own spaced-repetition state.
const REVIEW_KEY='manamon-phase3-review-v1';
const DAY=86400000;
function dayNumber(){let d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)}
const today=dayNumber();
let review={};
try{let v=JSON.parse(localStorage.getItem(REVIEW_KEY)||'{}');if(v&&typeof v==='object')review=v}catch(e){}
function record(i){let v=review[i];if(!v||typeof v!=='object')v={stage:0,streak:0,interval:1,due:today,seen:0};return v}
function storeReview(){try{localStorage.setItem(REVIEW_KEY,JSON.stringify(review))}catch(e){}}
function mode(i){return Math.min(3,Math.max(0,record(i).stage))}
function chooseSession(){
  // Due items first, then unseen items. If fewer than five, allow optional practice.
  let ids=data.map((_,i)=>i);
  let due=ids.filter(i=>record(i).seen>0&&record(i).due<=today).sort((a,b)=>record(a).due-record(b).due);
  let unseen=ids.filter(i=>record(i).seen===0);
  let later=ids.filter(i=>record(i).seen>0&&record(i).due>today).sort((a,b)=>record(a).due-record(b).due);
  return [...due,...unseen,...later].slice(0,5);
}
function drawHome(){let m=getMon(save.active),xp=save.xp[m.id]||0,l=level(xp);$('homeMonster').innerHTML=svg(m,l);$('homeName').textContent=m.name+(l>=4?' ✨':'');$('homeLevel').textContent=`レベル ${l}`;$('xpBar').style.width=(xp%50/50*100)+'%';$('xpText').textContent=`つぎの レベルまで ${50-xp%50} EXP`;$('total').textContent=save.clears+'かい';let due=data.filter((_,i)=>record(i).seen>0&&record(i).due<=today).length;$('dueInfo').textContent=due?`📚 きょうの ふくしゅう：${due}もん`:'🌸 きょうは あたらしい もんだいに ちょうせん！';$('missionCount').textContent=Math.min(5,data.length)+'もん';screen('home')}
function drawQuiz(){answered=false;let id=session[idx],q=data[id],stage=mode(id);$('subject').textContent=q.subject;$('counter').textContent=`${idx+1} / ${session.length} もん`;$('progress').style.width=(idx/session.length*100)+'%';$('question').innerHTML=q.q;$('feedback').hidden=true;$('next').hidden=true;$('reveal').hidden=true;$('selfGrade').hidden=true;$('options').innerHTML='';$('modeLabel').textContent=['3たく','4たく','ヒントなし','えらばず こたえる'][stage];
  if(stage>=2){$('modeLabel').textContent=stage===2?'おもいだして みよう':'えらばず こたえよう';$('options').innerHTML='<p class="sub">こえに だすか、あたまの なかで こたえてね。</p>';$('reveal').hidden=false;return}
  let order=stage===0?[0,1,2,3].filter(j=>j!==((q.a+1)%4)):[0,1,2,3]; // correct option is always retained
  order.forEach((j,k)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`${['A','B','C','D'][k]}　${q.opts[j]}`;b.onclick=()=>{if(answered)return;let ok=j===q.a;[...$('options').children].forEach((el,n)=>{el.disabled=true;if(order[n]===q.a)el.classList.add('good');else if(n===k)el.classList.add('bad')});completeAnswer(ok)};$('options').append(b)})
}
function completeAnswer(ok){if(answered)return;answered=true;if(ok)score++;let id=session[idx],q=data[id],v=record(id),oldStage=v.stage;
  v.seen=(v.seen||0)+1;v.last=today;
  if(ok){v.streak=(v.streak||0)+1;
    // Two correct responses on separate days to advance each mode.
    if(v.streak>=2&&v.lastSuccessDay!==today&&v.stage<3){v.stage++;v.streak=0}
    v.lastSuccessDay=today;
    v.interval=Math.min(30,Math.max(1,(v.interval||1)*2));
  }else{v.streak=0;v.interval=1;if(v.stage>0)v.stage--}
  v.due=today+v.interval;review[id]=v;storeReview();
  // A card can earn XP only once per local calendar day.
  let rewardKey='manamon-phase3-rewards-'+today;let rewards={};try{rewards=JSON.parse(localStorage.getItem(rewardKey)||'{}')||{}}catch(e){}
  let add=rewards[id]?0:(ok?10:5);rewards[id]=true;
  try{localStorage.setItem(rewardKey,JSON.stringify(rewards))}catch(e){}
  earned+=add;save.xp[save.active]=(save.xp[save.active]||0)+add;persist();
  $('feedback').innerHTML=`<strong>${ok?'せいかい！ ⭐':'ひとつ おぼえたね！ 🌱'} ${add?'+'+add+' EXP':'（けいけんちは きょう もらったよ）'}</strong><p>${q.why}</p><p class="small">${ok&&v.stage>oldStage?'✨ つぎは ひとつ うえの チャレンジ！':'つぎの ふくしゅうは '+v.interval+'にちご！'}</p>`;
  $('feedback').hidden=false;$('next').hidden=false;$('next').textContent=idx===session.length-1?'ぼうけん クリア！':'つぎの もんだいへ ▶';$('reveal').hidden=true;$('selfGrade').hidden=true;
}
function finish(){save.clears++;let unlock=null;if(save.clears===2&&save.unlocked.length<2)unlock=species.find(x=>!save.unlocked.includes(x.id));if(save.clears>=4&&save.unlocked.length<3)unlock=species.find(x=>!save.unlocked.includes(x.id));if(unlock)save.unlocked.push(unlock.id);persist();let m=getMon(save.active),l=level(save.xp[m.id]);$('result').textContent=`${session.length}もんちゅう ${score}もん せいかい！`;$('finishMonster').innerHTML=svg(m,l);$('finishName').textContent=m.name+' ・ レベル '+l;$('earned').textContent='+'+earned+' EXP';$('levelMessage').textContent=l>=4?'✨ しんかした すがた！':'あと '+(50-save.xp[m.id]%50)+' EXPで レベルアップ';$('newFriend').hidden=!unlock;if(unlock)$('newFriend').innerHTML=`🎁 あたらしい なかまを はっけん！<br><strong>${unlock.name}</strong> が ずかんに くわわったよ！`;screen('finish')}
function drawBook(){let list=$('collection');list.innerHTML='';save.unlocked.forEach(id=>{let m=getMon(id),l=level(save.xp[id]);let b=document.createElement('button');b.className='card'+(save.active===id?' selected':'');b.innerHTML=svg(m,l)+`<div class="name">${m.name}</div><div class="tiny">Lv.${l}</div>`;list.append(b)});let remain=3-save.unlocked.length;let m=getMon(save.active);$('bookDetail').innerHTML=svg(m,level(save.xp[m.id]))+`<p><strong>${m.name}</strong> と ぼうけんちゅう！</p><p class="small">${remain?'まだ '+remain+'しゅるいの なかまが まっているよ。':'3しゅるい ぜんぶ はっけん！'}</p><p class="tiny sub">なかまは ぼうけんを つづけると ふえていくよ。</p>`;screen('book')}
$('start').onclick=()=>{session=chooseSession();idx=0;score=0;earned=0;screen('quiz');drawQuiz()};$('next').onclick=()=>{if(!answered)return;idx++;if(idx===session.length)finish();else drawQuiz()};$('reveal').onclick=()=>{let q=data[session[idx]];$('feedback').innerHTML='<strong>こたえ：'+q.opts[q.a]+'</strong><p>'+q.why+'</p>';$('feedback').hidden=false;$('reveal').hidden=true;$('selfGrade').hidden=false};$('gradeNo').onclick=()=>completeAnswer(false);$('gradeYes').onclick=()=>completeAnswer(true);$('again').onclick=drawHome;$('toBook').onclick=drawBook;$('bookBack').onclick=drawHome;
save.starter='leaf';save.active='leaf';if(!save.unlocked.includes('leaf'))save.unlocked.unshift('leaf');persist();drawHome()
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
